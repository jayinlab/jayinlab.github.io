{{- $id := printf "aspm4-%d" now.UnixNano -}}
<style>
#{{ $id }}{max-width:820px;margin:2rem auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#e7edf7}
#{{ $id }} *{box-sizing:border-box}
#{{ $id }} .aspm4-shell{background:#0b1220;border:1px solid #253149;border-radius:8px;overflow:hidden}
#{{ $id }} .aspm4-top{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#111a2c;border-bottom:1px solid #253149;flex-wrap:wrap}
#{{ $id }} button{background:#172238;border:1px solid #33425e;color:#dce7f7;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;min-width:44px}
#{{ $id }} button:hover{border-color:#79a7ff;background:#1d2d4a}
#{{ $id }} button.aspm4-primary{background:#20385f;border-color:#79a7ff;color:#f2f7ff;font-weight:700}
#{{ $id }} .aspm4-count{margin-left:auto;color:#9aa8bf;font-size:12px}
#{{ $id }} .aspm4-stage{padding:14px}
#{{ $id }} .aspm4-desc{min-height:86px;background:#101a2d;border:1px solid #253149;border-left:3px solid #79a7ff;border-radius:7px;padding:11px 13px;margin-bottom:12px;line-height:1.55}
#{{ $id }} .aspm4-desc b{color:#ffffff}
#{{ $id }} .aspm4-desc .aspm4-tag{display:inline-block;background:#79a7ff;color:#081120;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;margin-right:6px}
#{{ $id }} .aspm4-grid{display:grid;grid-template-columns:1fr;gap:9px}
#{{ $id }} .aspm4-row{display:grid;grid-template-columns:122px repeat(5,minmax(96px,1fr));gap:7px;align-items:stretch}
#{{ $id }} .aspm4-head,#{{ $id }} .aspm4-cell{border:1px solid #253149;border-radius:7px;background:#111a2c;min-height:58px;padding:8px;position:relative;overflow:hidden}
#{{ $id }} .aspm4-head{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#f5f8ff}
#{{ $id }} .aspm4-cell{transition:border-color .25s,background .25s,box-shadow .25s,opacity .25s,transform .25s}
#{{ $id }} .aspm4-cell.dim{opacity:.36}
#{{ $id }} .aspm4-cell.active{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 70%,transparent),0 0 18px color-mix(in srgb,var(--accent) 22%,transparent);background:color-mix(in srgb,var(--accent) 13%,#111a2c)}
#{{ $id }} .aspm4-cell.done{border-color:#68d8b0;background:rgba(104,216,176,.08)}
#{{ $id }} .aspm4-k{font-size:10px;color:#8fa0ba;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
#{{ $id }} .aspm4-v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:#f3f7ff;line-height:1.3}
#{{ $id }} .aspm4-note{font-size:11px;color:#a9b7cf;margin-top:4px;line-height:1.35}
#{{ $id }} .global{--accent:#79a7ff}
#{{ $id }} .local{--accent:#68d8b0}
#{{ $id }} .private{--accent:#f4b86a}
#{{ $id }} .scalar{--accent:#d7a3ff}
#{{ $id }} .aspm4-label{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,#111a2c)}
#{{ $id }} .aspm4-ribbon{height:4px;position:absolute;left:0;right:0;top:0;background:var(--accent)}
#{{ $id }} .aspm4-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;color:#9aa8bf;font-size:11px}
#{{ $id }} .aspm4-pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #253149;border-radius:999px;padding:4px 8px;background:#101a2d}
#{{ $id }} .aspm4-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
#{{ $id }} .aspm4-mobile{display:none;color:#9aa8bf;font-size:11px;margin-bottom:8px}
@media(max-width:760px){
  #{{ $id }} .aspm4-mobile{display:block}
  #{{ $id }} .aspm4-stage{overflow-x:auto}
  #{{ $id }} .aspm4-row{min-width:760px}
}
</style>

<div id="{{ $id }}">
  <div class="aspm4-shell">
    <div class="aspm4-top">
      <button class="aspm4-prev">이전</button>
      <button class="aspm4-next aspm4-primary">다음</button>
      <button class="aspm4-auto">자동 재생</button>
      <button class="aspm4-reset">처음</button>
      <span class="aspm4-count"></span>
    </div>
    <div class="aspm4-stage">
      <div class="aspm4-mobile">모바일에서는 표를 좌우로 밀어서 전체 계층을 볼 수 있습니다.</div>
      <div class="aspm4-desc"></div>
      <div class="aspm4-grid"></div>
      <div class="aspm4-legend">
        <span class="aspm4-pill global"><span class="aspm4-dot"></span>__global: descriptor/resource</span>
        <span class="aspm4-pill local"><span class="aspm4-dot"></span>__local: LDS/workgroup resource</span>
        <span class="aspm4-pill private"><span class="aspm4-dot"></span>private: register/scratch</span>
        <span class="aspm4-pill scalar"><span class="aspm4-dot"></span>scalar: constant path</span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var root=document.getElementById("{{ $id }}");
  if(!root)return;
  var grid=root.querySelector(".aspm4-grid");
  var desc=root.querySelector(".aspm4-desc");
  var count=root.querySelector(".aspm4-count");
  var prev=root.querySelector(".aspm4-prev");
  var next=root.querySelector(".aspm4-next");
  var auto=root.querySelector(".aspm4-auto");
  var reset=root.querySelector(".aspm4-reset");
  var timer=null;
  var step=0;

  var cols=["OpenCL C","clspv / SPIR-V","Vulkan 계약","Driver state","PM4 직관"];
  var rows=[
    {cls:"global",label:"__global",cells:[
      ["arg0 x, arg1 y","GPU memory object pointer"],
      ["StorageBuffer","descriptor-backed interface"],
      ["set/binding slot","buffer range + GPU VA"],
      ["resource descriptor","dispatch 전 bind/update 확인"],
      ["user-data/resource state","SET_* 계열 상태 뒤 dispatch"]
    ]},
    {cls:"local",label:"__local",cells:[
      ["tile[lid]","work-group shared scratchpad"],
      ["Workgroup","shader local storage"],
      ["descriptor 아님","LDS 크기/usage 계약"],
      ["LDS allocation","work-group당 자원 계산"],
      ["LDS-related state","occupancy와 dispatch 제한에 영향"]
    ]},
    {cls:"private",label:"private",cells:[
      ["tmp, gid, lid","work-item마다 따로 존재"],
      ["Function/Private","SSA value 또는 private object"],
      ["binding 없음","shader 내부 temporary"],
      ["VGPR/SGPR","필요하면 scratch spill"],
      ["register/scratch state","성능/occupancy에 영향"]
    ]},
    {cls:"scalar",label:"scalar",cells:[
      ["float a","작은 by-value kernel arg"],
      ["constant-like value","implementation dependent lowering"],
      ["push/uniform/inline","backend 정책에 따라 선택"],
      ["inline/user data","dispatch 전 작은 상수 설정"],
      ["user-data payload","descriptor일 수도, 아닐 수도 있음"]
    ]}
  ];
  var steps=[
    {title:"시작",body:"같은 OpenCL 커널 안의 값이라도 address space가 다르면 뒤쪽 계층의 계약이 완전히 달라진다. 먼저 네 종류의 값을 한 화면에 놓고 비교한다.",active:[]},
    {title:"1. OpenCL C에서 의미가 갈라진다",body:"__global은 외부 GPU memory object, __local은 work-group 공유 공간, private은 work-item 자기 임시값이다. scalar 인자는 작지만 별도 lowering 정책을 탄다.",active:["0-0","1-0","2-0","3-0"]},
    {title:"2. clspv/SPIR-V storage class로 고정된다",body:"clspv는 이 의미를 SPIR-V interface와 storage class로 바꾼다. 여기서 __global은 descriptor-backed interface가 되지만 __local은 Workgroup storage로 남는다.",active:["0-1","1-1","2-1","3-1"],doneCols:[0]},
    {title:"3. Vulkan에서는 descriptor가 되는 것과 안 되는 것이 나뉜다",body:"__global buffer는 set/binding slot을 통해 shader에 연결된다. 반면 __local과 private은 descriptor table에서 찾을 대상이 아니다.",active:["0-2","1-2","2-2","3-2"],doneCols:[0,1]},
    {title:"4. Driver는 dispatch 전에 필요한 state를 준비한다",body:"driver는 descriptor/resource state, LDS usage, register allocation, scalar 전달 경로를 각각 준비한다. 이 준비가 끝난 뒤 dispatch packet이 의미를 가진다.",active:["0-3","1-3","2-3","3-3"],doneCols:[0,1,2]},
    {title:"5. PM4 관점에서는 서로 다른 상태로 보인다",body:"PM4 레벨의 직관에서는 __global은 user-data/resource state, __local은 LDS 관련 state, private은 register/scratch pressure, scalar는 작은 user-data payload 쪽으로 이어진다.",active:["0-4","1-4","2-4","3-4"],doneCols:[0,1,2,3]},
    {title:"6. 디버깅 포인트: state 계약과 memory visibility를 분리한다",body:"descriptor가 맞는지는 'shader가 어느 주소를 보느냐'의 문제다. barrier/visibility는 '그 주소의 최신 값이 보이느냐'의 문제다. 둘은 같이 필요하지만 같은 계약은 아니다.",active:["0-2","0-3","0-4"],doneCols:[0,1]},
    {title:"정리",body:"__global은 descriptor/resource, __local은 workgroup shared resource, private은 lane-local register/scratch 계약이다. 이 구분이 OpenCL -> Vulkan -> PM4 추적의 핵심 축이다.",active:["0-4","1-4","2-4","3-4"],doneCols:[0,1,2,3,4]}
  ];

  function build(){
    var header=document.createElement("div");
    header.className="aspm4-row";
    var empty=document.createElement("div");
    empty.className="aspm4-head";
    empty.textContent="Address space";
    header.appendChild(empty);
    cols.forEach(function(c){
      var h=document.createElement("div");
      h.className="aspm4-head";
      h.textContent=c;
      header.appendChild(h);
    });
    grid.appendChild(header);
    rows.forEach(function(row,ri){
      var line=document.createElement("div");
      line.className="aspm4-row";
      var lab=document.createElement("div");
      lab.className="aspm4-head aspm4-label "+row.cls;
      lab.innerHTML='<span class="aspm4-ribbon"></span>'+row.label;
      line.appendChild(lab);
      row.cells.forEach(function(cell,ci){
        var el=document.createElement("div");
        el.className="aspm4-cell "+row.cls;
        el.setAttribute("data-key",ri+"-"+ci);
        el.setAttribute("data-col",ci);
        el.innerHTML='<span class="aspm4-ribbon"></span><div class="aspm4-k">'+cols[ci]+'</div><div class="aspm4-v">'+cell[0]+'</div><div class="aspm4-note">'+cell[1]+'</div>';
        line.appendChild(el);
      });
      grid.appendChild(line);
    });
  }
  function render(){
    var s=steps[step];
    desc.innerHTML='<span class="aspm4-tag">'+s.title+'</span><b>'+s.title.replace(/^[0-9]+\. /,"")+'</b><br>'+s.body;
    count.textContent="Step "+step+" / "+(steps.length-1);
    root.querySelectorAll(".aspm4-cell").forEach(function(el){
      var key=el.getAttribute("data-key");
      var col=Number(el.getAttribute("data-col"));
      var active=s.active.indexOf(key)>=0;
      var done=s.doneCols && s.doneCols.indexOf(col)>=0;
      el.classList.toggle("active",active);
      el.classList.toggle("done",!!done && !active);
      el.classList.toggle("dim",s.active.length>0 && !active && !done);
    });
    prev.disabled=step===0;
    next.disabled=step===steps.length-1;
  }
  function stopAuto(){
    if(timer){clearInterval(timer);timer=null;}
    auto.textContent="자동 재생";
  }
  function go(n){
    step=Math.max(0,Math.min(steps.length-1,n));
    render();
    if(step===steps.length-1)stopAuto();
  }
  prev.addEventListener("click",function(){stopAuto();go(step-1);});
  next.addEventListener("click",function(){stopAuto();go(step+1);});
  reset.addEventListener("click",function(){stopAuto();go(0);});
  auto.addEventListener("click",function(){
    if(timer){stopAuto();return;}
    auto.textContent="일시정지";
    timer=setInterval(function(){go(step+1);},1800);
  });
  build();
  render();
})();
</script>
